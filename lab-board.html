<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lab Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky toolbar, then a stage-by-lane grid (board) or one Gantt strip per project (timeline). */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --band:#F5F7F9; --band-2:#E8ECEF; --line:#D3DADF;
  --fg:#14202A; --muted:#566673; --accent:#3346D6; --accent-fg:#FFFFFF;
  --crit:#C22B3D; --warn:#9A5A07; --ok:#1C7448; --shadow:0 1px 2px rgba(20,32,42,.10);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --lane-w:150px; --lab-w:240px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B; --surface:#17212A; --band:#121B22; --band-2:#1B2630; --line:#2A3743;
    --fg:#E6ECF1; --muted:#93A3B1; --accent:#8C9BFF; --accent-fg:#0E151B;
    --crit:#FF7C8A; --warn:#F0B35A; --ok:#5BD08E; --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#17212A; --band:#121B22; --band-2:#1B2630; --line:#2A3743;
  --fg:#E6ECF1; --muted:#93A3B1; --accent:#8C9BFF; --accent-fg:#0E151B;
  --crit:#FF7C8A; --warn:#F0B35A; --ok:#5BD08E; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);padding-inline:16px;padding-block:14px 40px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0;margin-right:auto}
.brand h1{font:700 22px/1.1 var(--f-display);letter-spacing:-.01em}
.stats{display:flex;flex-wrap:wrap;gap:2px 14px;font:12px var(--f-mono);color:var(--muted)}
.stats b{color:var(--fg);font-weight:500}
.stats .bad b{color:var(--crit)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.tabs button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.danger.armed{background:var(--crit);color:var(--surface);border-color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.dot-stale{width:7px;height:7px;border-radius:50%;background:var(--crit);display:none}
.stale .dot-stale{display:inline-block}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;line-height:1;display:inline-flex}
.icon-btn:hover{color:var(--fg);background:var(--band-2)}
.icon-btn[disabled]{opacity:.35;cursor:default}
.status{font:12px var(--f-mono);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.status[data-s="saving"] i{background:var(--warn)}
.status[data-s="local"] i{background:var(--muted)}
.status[data-s="error"] i,.status[data-s="readonly"] i{background:var(--crit)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select,.filters input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
.filters input[type=search]{width:190px;max-width:100%}
.filters .tog[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.filters label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.hide-tl .grp{display:none}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border:1px dashed var(--muted);border-radius:8px;padding:8px 12px;margin-bottom:12px;background:var(--surface);color:var(--muted)}
.banner strong{color:var(--fg);font-weight:600}
.banner .sp{flex:1}

/* board */
.board-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.board{display:grid;min-width:calc(var(--lane-w) + var(--n) * 250px)}
.corner,.stage-head{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:2px solid var(--fg)}
.corner{left:0;z-index:4;padding:10px 12px;font:12px var(--f-mono);color:var(--muted);display:flex;align-items:flex-end}
.stage-head{padding:10px 12px;display:flex;align-items:center;gap:8px;border-left:1px solid var(--line)}
.stage-head h3{font:600 15px var(--f-display);letter-spacing:.01em}
.stage-head .count{font:12px var(--f-mono);color:var(--muted)}
.stage-head .wip{margin-left:auto;font:12px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.stage-head .wip.over{color:var(--surface);background:var(--crit);border-color:var(--crit)}
.stage-head svg{width:14px;height:14px;color:var(--ok)}
.lane-head{position:sticky;left:0;z-index:2;background:var(--surface);border-top:1px solid var(--line);padding:10px 8px 10px 10px;display:flex;align-items:flex-start;gap:6px;min-width:0}
.lane-head .nm{font-weight:600;display:flex;align-items:center;gap:7px;min-width:0;overflow-wrap:anywhere}
.lane-head .count{font:12px var(--f-mono);color:var(--muted);margin-left:auto}
.lane-head .tg{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;display:inline-flex;transition:transform .15s}
.lane-head.collapsed .tg{transform:rotate(-90deg)}
.lane-head .pdot{width:10px;height:10px;border-radius:3px;background:var(--pc);flex:none}
.lane-head .pri{font:500 11px var(--f-mono);padding:1px 5px;border-radius:4px;border:1px solid currentColor;flex:none}
.pri.critical{color:var(--crit)} .pri.high{color:var(--warn)} .pri.medium{color:var(--muted)} .pri.low{color:var(--muted);opacity:.75}
.cell{background:var(--band);border-top:1px solid var(--line);border-left:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:84px;min-width:0}
.cell.is-done{background:var(--band-2)}
.cell.collapsed{min-height:0;padding:6px 10px;flex-direction:row;align-items:center}
.cell .mini{font:12px var(--f-mono);color:var(--muted)}
.cell.over{outline:2px dashed var(--accent);outline-offset:-3px;background:color-mix(in srgb,var(--accent) 9%,var(--band))}
.add{border:1px dashed transparent;background:none;color:var(--muted);border-radius:6px;padding:4px 8px;text-align:left;cursor:pointer;font-size:12px;opacity:0;transition:opacity .12s}
.cell:hover .add,.add:focus-visible{opacity:1}
.add:hover{border-color:var(--muted);color:var(--fg)}
@media (hover:none){.add{opacity:1}}
.drop-line{height:3px;border-radius:2px;background:var(--accent);flex:none}
.ro .edit-only{display:none!important}

.card{background:color-mix(in srgb,var(--pc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--pc) 30%,var(--line));border-radius:7px;padding:9px 10px;box-shadow:var(--shadow);cursor:grab;display:flex;flex-direction:column;gap:7px;min-width:0}
.card:hover{border-color:color-mix(in srgb,var(--pc) 60%,var(--line))}
.card.dragging{opacity:.35}
.card.is-done h4{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.card h4{font:600 13.5px/1.3 var(--f-body);overflow-wrap:anywhere}
.card-top{display:flex;align-items:center;gap:8px;min-width:0}
.ref{font:11px var(--f-mono);color:var(--muted);flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:99px;min-width:0;max-width:100%;
  background:color-mix(in srgb,var(--pc) 16%,transparent);color:color-mix(in srgb,var(--pc) 62%,var(--fg))}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--pc);flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.badge{font:500 11px var(--f-mono);padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.badge.late{color:var(--crit);border-color:var(--crit)}
.badge.soon{color:var(--warn);border-color:var(--warn)}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.badge.blk{color:var(--surface);background:var(--crit);border-color:var(--crit)}
.who{margin-left:auto;font:500 10.5px var(--f-mono);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg);flex:none}

.empty{border:1px dashed var(--line);border-radius:10px;padding:40px 20px;text-align:center;background:var(--surface);color:var(--muted)}
.empty h2{font:700 20px var(--f-display);color:var(--fg);margin-bottom:6px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.loading{color:var(--muted);padding:30px 0}

/* timeline */
.tl-proj{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.tl-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tl-head h3{font:700 17px var(--f-display);display:flex;align-items:center;gap:8px}
.tl-head h3 i{width:12px;height:12px;border-radius:3px;background:var(--pc)}
.tl-head .meta{font:12px var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px}
.prog{width:110px;height:6px;border-radius:99px;background:var(--band-2);overflow:hidden;align-self:center}
.prog b{display:block;height:100%;background:var(--pc)}
.tl-scroll{overflow-x:auto}
.tl{position:relative}
.tl-axis,.tl-row{display:grid;grid-template-columns:var(--lab-w) 1fr}
.tl-axis{border-bottom:1px solid var(--line);height:30px}
.tl-axis .pl{position:relative}
.tl-axis .m{position:absolute;top:8px;font:11px var(--f-mono);color:var(--muted);white-space:nowrap;padding-left:5px}
.tl-axis .tdy{position:absolute;top:4px;transform:translateX(-50%);font:500 10px var(--f-mono);background:var(--accent);color:var(--accent-fg);padding:1px 5px;border-radius:4px}
.tl-rows{position:relative}
.tl-grid{position:absolute;top:0;bottom:0;left:var(--lab-w);right:0;pointer-events:none}
.tl-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.6}
.tl-grid i.mo{opacity:1;background:var(--muted);opacity:.45}
.tl-grid i.td{background:var(--accent);opacity:1;width:2px}
.tl-row{height:36px;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.tl-row .lb{position:sticky;left:0;z-index:2;background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;border:0;text-align:left;cursor:pointer;min-width:0;border-right:1px solid var(--line)}
.tl-row .lb span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;min-width:0}
.tl-row:hover .lb{background:var(--band)}
.tl-row .pl{position:relative}
.bar{position:absolute;top:8px;height:20px;min-width:10px;border-radius:5px;border:0;padding:0;cursor:pointer;background:color-mix(in srgb,var(--pc) 88%,transparent)}
.bar.done{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--pc) 45%,transparent) 0 5px,color-mix(in srgb,var(--pc) 25%,transparent) 5px 10px)}
.bar.late{box-shadow:0 0 0 2px var(--crit)}
.bar.blk::after{content:"";position:absolute;right:3px;top:3px;bottom:3px;width:4px;border-radius:2px;background:var(--surface)}
.note{position:absolute;top:10px;font:11px var(--f-mono);color:var(--muted);white-space:nowrap;pointer-events:none}
.note.late{color:var(--crit)}
.tl-none{padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.tl-none button{border:1px solid var(--line);background:var(--band);border-radius:99px;padding:2px 9px;cursor:pointer;font-size:12px}
.tl-none button:hover{border-color:var(--muted)}
.tl-empty{padding:18px 14px;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--fg) 45%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);margin-block:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:calc(100% - 8px)}
.modal.wide{width:min(720px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-head h2{font:700 17px var(--f-display)}
.modal-body{padding:16px;overflow-y:auto;min-height:0}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.modal-foot .sp{flex:1}
fieldset{display:grid;grid-template-columns:1fr 1fr;gap:12px;border:0;padding:0;margin:0;min-width:0}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:500;color:var(--muted)}
.span2{grid-column:1/-1}
.modal input[type=text],.modal input[type=date],.modal input[type=number],.modal select,.modal textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.modal textarea{resize:vertical}
.chk{display:flex;align-items:center;gap:8px;color:var(--fg)}
.form-err{color:var(--crit);margin:0;grid-column:1/-1;font-weight:500}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.srow,.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.srow input[type=text],.prow input[type=text]{flex:1 1 150px}
.srow .wipin{width:64px!important;flex:none}
.srow label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.sw-set{display:flex;gap:4px}
.sw{width:22px;height:22px;border-radius:6px;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.sec{margin:0 0 18px}
.sec h3{font:600 14px var(--f-display);margin-bottom:6px}
.msg{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.msg.err{color:var(--crit)} .msg.ok{color:var(--ok)}
.modal pre,.modal textarea.json{font:11.5px/1.4 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px;max-height:160px;overflow:auto;width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:500;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.more{border:1px dashed var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:5px 8px;cursor:pointer;font-size:12px;text-align:left}
.more:hover{border-color:var(--muted);color:var(--fg)}
/* touch drag */
@media (hover:none){.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
.drag-ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;margin:0;box-shadow:0 14px 34px rgba(0,0,0,.28);opacity:.96}
body.touch-dragging{-webkit-user-select:none;user-select:none;overscroll-behavior:none}
/* toast action (Undo) */
.toast button{margin-left:12px;background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 10px;cursor:pointer;font-weight:600}
/* color picker */
.cdet>summary{list-style:none;display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--surface);font-size:12.5px;font-family:var(--f-mono)}
.cdet>summary::-webkit-details-marker{display:none}
.cdet[open]>summary{border-color:var(--muted)}
.chipc{width:16px;height:16px;border-radius:4px;background:var(--c);flex:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 30%,transparent)}
.cp .sw:not([aria-pressed="true"]){box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 22%,transparent)}
.cp{display:flex;flex-direction:column;gap:10px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.cp-grid{display:grid;grid-template-columns:repeat(auto-fill,24px);gap:6px;flex:1;min-width:0}
.cp .sw{width:24px;height:24px}
.cp-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.cp-row>span{min-width:52px}
.cp input[type=color]{width:40px;height:28px;padding:0 2px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.cp .cp-hex{width:96px!important;font-family:var(--f-mono);border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 7px}
.cp .cp-hex[aria-invalid="true"]{border-color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.sm[aria-pressed="true"]{border-color:var(--fg)}
.prow .cdet[open]{flex-basis:100%;order:3}
.delq{font-size:12px;color:var(--muted)}
.srow select.s-dest{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 8px}
.rm-note{margin-top:10px}
@media (max-width:600px){
  fieldset{grid-template-columns:1fr}
  :root{--lane-w:120px;--lab-w:170px}
  .filters input[type=search]{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header class="top">
    <div class="brand">
      <h1>Lab Task Board</h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="actions">
      <span class="status" id="status" data-s="saving"><i></i><span>Loading</span></span>
      <div class="tabs" role="tablist" aria-label="View">
        <button role="tab" id="tab-board" data-view="board" aria-selected="true">Board</button>
        <button role="tab" id="tab-timeline" data-view="timeline" aria-selected="false">Timelines</button>
      </div>
      <button class="btn primary edit-only" id="btn-new" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>New task</button>
      <button class="btn edit-only" id="btn-projects" type="button">Projects</button>
      <button class="btn edit-only" id="btn-stages" type="button">Stages</button>
      <button class="btn" id="btn-backup" type="button">Backup <span class="dot-stale" id="stale-dot"></span></button>
    </div>
  </header>

  <div class="filters" id="filters">
    <select id="flt-project" aria-label="Filter by project"></select>
    <select id="flt-assignee" aria-label="Filter by assignee"></select>
    <input id="flt-q" type="search" placeholder="Search tasks" aria-label="Search tasks">
    <button class="btn tog" id="flt-overdue" type="button" aria-pressed="false">Overdue only</button>
    <button class="btn ghost" id="flt-clear" type="button" hidden>Clear filters</button>
    <label class="grp">Swimlanes
      <select id="grp" aria-label="Group swimlanes by">
        <option value="priority">Priority</option>
        <option value="project">Project</option>

/* drag and drop: shared by mouse (HTML5 drag events) and touch (long-press, pointer events) */

/* ---------- timeline ---------- */

  var h='<section class="tl-proj" style="--pc:'+esc(p.color)+'"><div class="tl-head"><h3><i></i>'+esc(p.name)+'</h3><div class="prog" title="'+pctDone+'% done"><b style="width:'+pctDone+'%"></b></div><div class="meta"><span>'+doneN+' of '+tasks.length+' done</span>';
  if(dated.length){
    var mn=Math.min.apply(null,dated.map(function(t){return toDay(t.start&&t.start<=t.due?t.start:t.due)})),mx=Math.max.apply(null,dated.map(function(t){return toDay(t.due)}));

  }

  h+='</div></div>';
  if(!dated.length){
    h+='<div class="tl-empty">'+(tasks.length?'No deadlines set yet. Open a task and add a deadline to place it on this timeline.':'No tasks in this project yet.')+'</div>';
  }else{
    var s=Math.min.apply(null,dated.map(function(t){return toDay(t.start&&t.start<=t.due?t.start:t.due)})),e=Math.max.apply(null,dated.map(function(t){return toDay(t.due)}));

        axis+='<span class="m" style="left:'+pct(d).toFixed(3)+'%">'+lab+'</span>';
      }
      if(dom===1)grid+='<i class="mo" style="left:'+pct(d).toFixed(3)+'%"></i>';
      else if(dow===1)grid+='<i style="left:'+pct(d).toFixed(3)+'%"></i>';
    }

    if(showToday){grid+='<i class="td" style="left:'+pct(TODAY+0.5).toFixed(3)+'%"></i>';axis+='<span class="tdy" style="left:'+pct(TODAY+0.5).toFixed(3)+'%">Today</span>'}
    h+='<div class="tl-scroll"><div class="tl" style="min-width:calc(var(--lab-w) + '+minw+'px)"><div class="tl-axis"><div></div><div class="pl">'+axis+'</div></div><div class="tl-rows"><div class="tl-grid">'+grid+'</div>';
    var tk='tl:'+p.id,rows=ui.expanded[tk]?dated:dated.slice(0,TL_CAP);
    rows.forEach(function(t){
      var sd=Math.max(s,Math.min(e,toDay(t.start&&t.start<=t.due?t.start:t.due))),ed=Math.max(sd,Math.min(e,toDay(t.due))),left=pct(sd),w=(ed-sd+1)/total*100;
      var done=isDone(t),late=!done&&ed<TODAY,st=stageOf(stageKey(t));
      h+='<div class="tl-row"><button class="lb" type="button" data-edit="'+esc(t.id)+'" title="'+esc(t.title)+'"><span class="ref">'+esc(t.ref)+'</span><span class="t">'+esc(t.title)+'</span></button>'
        +'<div class="pl"><button type="button" class="bar'+(done?' done':'')+(late?' late':'')+(t.blocked?' blk':'')+'" data-edit="'+esc(t.id)+'" style="'+(t.color?'--pc:'+esc(t.color)+';':'')+'left:'+left.toFixed(3)+'%;width:'+w.toFixed(3)+'%" aria-label="'+esc(t.title+', '+st.name+', due '+t.due)+'"></button>'
        +'<span class="note'+(late?' late':'')+'" style="left:calc('+(left+w).toFixed(3)+'% + 7px)">'+fmtShort(t.due)+' · '+esc(st.name)+'</span></div></div>';
    });
    h+='</div></div></div>';
    if(dated.length>TL_CAP)h+='<div class="tl-none"><button type="button" data-act="'+(ui.expanded[tk]?'less':'more')+'" data-key="'+esc(tk)+'">'+(ui.expanded[tk]?'Show the first '+TL_CAP+' rows':'Show all '+dated.length+' rows')+'</button></div>';
    if(clipped)h+='<div class="tl-none">'+clipped+' task'+(clipped===1?' falls':'s fall')+' outside the 3-year window shown and '+(clipped===1?'is':'are')+' pinned to its edge. Check for a mistyped year.</div>';
  }
  if(undated.length){
    h+='<div class="tl-none"><span>No deadline:</span>'+undated.map(function(t){return '<button type="button" data-edit="'+esc(t.id)+'">'+esc(t.ref)+' '+esc(t.title)+'</button>'}).join('')+'</div>';
  }
  return h+'</section>';
}
function renderTimeline(){

/* ---------- modal framework ---------- */
var cur=null,lastFocus=null;
function openModal(o){
  cur=o;lastFocus=document.activeElement;
  $('#modal-title').textContent=o.title;$('#modal-body').innerHTML=o.body;$('#modal-foot').innerHTML=o.foot||'';
  $('#modal').classList.toggle('wide',!!o.wide);
  $('#overlay').hidden=false;
  if(o.mount)o.mount();
  o.snap=formSnap();
  var f=$('#modal-body input:not([type=hidden]),#modal-body textarea,#modal-body select');if(f&&!o.noFocus)f.focus();
}
function formSnap(){return $$('#modal input,#modal select,#modal textarea,#modal [aria-pressed]').map(function(e){return e.type==='checkbox'?e.checked:e.hasAttribute('aria-pressed')?e.getAttribute('aria-pressed'):e.value}).join('\u0001')}
// Escape and backdrop clicks ask twice when the dialog has edits; Cancel and the close button still close at once.
function requestClose(){
  if(cur&&!readOnly&&!cur.armedClose&&formSnap()!==cur.snap){
    var c=cur;c.armedClose=true;toast('Unsaved changes. Press Esc or click outside again to discard them.',4000);
    setTimeout(function(){c.armedClose=false},4000);return;
  }
  closeModal();
}
function closeModal(){
  $('#overlay').hidden=true;$('#modal-body').innerHTML='';$('#modal-foot').innerHTML='';cur=null;
  if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}
}
var toastT=null,toastAct=null;
function toast(msg,ms,act){
  var t=$('#toast');t.textContent=msg;toastAct=act||null;
  if(act){var b=document.createElement('button');b.type='button';b.textContent=act.label;b.dataset.toastAct='1';t.appendChild(b)}
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;toastAct=null},ms||2800);
}
// Every destructive action takes a snapshot first and offers it back for a few seconds.
function offerUndo(msg,snap){
  toast(msg,10000,{label:'Undo',fn:function(){try{state=normalize(JSON.parse(snap))}catch(e){toast('Could not undo');return}commit();toast('Undone')}});
}

/* ---------- color picker ---------- */
// 24 palette colors, the board's saved custom colors, and a free picker plus hex field for anything else.
function colorPicker(ctx,cur,opts){
  var on=function(c){return String(!!cur&&c.toLowerCase()===cur.toLowerCase())};
  var sw=function(c){return '<button class="sw" type="button" style="--c:'+c+'" data-m="pick" data-ctx="'+esc(ctx)+'" data-c="'+c+'" aria-pressed="'+on(c)+'" aria-label="Color '+c+'" title="'+c+'"></button>'};
  var saved=state.meta.customColors||[];
  return '<div class="cp" data-ctx="'+esc(ctx)+'">'
    +(opts&&opts.none?'<div class="cp-row"><button class="btn sm" type="button" data-m="pick" data-ctx="'+esc(ctx)+'" data-c="" aria-pressed="'+String(!cur)+'">'+esc(opts.none)+'</button></div>':'')
    +'<div class="cp-grid" role="group" aria-label="Palette">'+PALETTE.map(sw).join('')+'</div>'
    +(saved.length?'<div class="cp-row"><span>Saved</span><div class="cp-grid" role="group" aria-label="Saved colors">'+saved.map(sw).join('')+'</div></div>':'')
    +'<div class="cp-row"><span>Custom</span><input type="color" class="cp-in" data-ctx="'+esc(ctx)+'" value="'+esc((cur||'#3346d6').toLowerCase())+'" aria-label="Pick any color">'
    +'<input type="text" class="cp-hex" data-ctx="'+esc(ctx)+'" maxlength="7" spellcheck="false" placeholder="#RRGGBB" value="'+esc(cur||'')+'" aria-label="Hex color code"></div></div>';
}
// Updates a picker in place (no repaint), so the native color dialog stays open while dragging.
function syncPicker(ctx,c,label){
  var box=$('.cp[data-ctx="'+cssEsc(ctx)+'"]');if(!box)return;
  $$('[data-m=pick]',box).forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.c?!!c&&b.dataset.c.toLowerCase()===c.toLowerCase():!c))});
  var hx=$('.cp-hex',box);if(hx&&document.activeElement!==hx){hx.value=c||'';hx.removeAttribute('aria-invalid')}
  var ci=$('.cp-in',box);if(ci&&c&&document.activeElement!==ci)ci.value=c.toLowerCase();
  var det=box.closest('details');if(!det)return;
  var ch=$('summary .chipc',det);if(ch)ch.style.setProperty('--c',c||det.dataset.def);
  var lb=$('summary .clab',det);if(lb&&label!==undefined)lb.textContent=label;
}
function colorField(ctx,c,def,labelNone){
  var lab=labelNone==='Color'?'Color':(c||labelNone);
  return '<details class="cdet" data-def="'+esc(def)+'"><summary><i class="chipc" style="--c:'+esc(c||def)+'"></i><span class="clab">'+esc(lab)+'</span></summary>'+colorPicker(ctx,c,labelNone==='Color'?null:{none:'Use '+labelNone.toLowerCase()})+'</details>';
}
function parseHex(v){v=String(v||'').trim();if(v&&v[0]!=='#')v='#'+v;if(/^#[0-9a-f]{3}$/i.test(v))v='#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];return HEX.test(v)?v.toLowerCase():null}

/* ---------- task dialog ---------- */
function openTask(id,preset){

    +'<label class="fld"><span>Priority</span><select id="f-priority">'+PRIORITIES.map(function(p){return opt(p.key,p.short+' '+p.label,p.key===d.priority)}).join('')+'</select></label>'
    +'<label class="fld"><span>Assignee</span><input id="f-assignee" type="text" list="people" maxlength="60" value="'+esc(d.assignee)+'"><datalist id="people">'+people().map(function(n){return '<option value="'+esc(n)+'">'}).join('')+'</datalist></label>'

    +'<p class="form-err" id="f-err" role="alert" hidden></p></fieldset></form>';
  var foot=readOnly?'<span class="sp"></span><button class="btn" type="button" data-close>Close</button>'
    :(ex?'<button class="btn danger" type="button" data-m="delete">Delete</button>':'')+'<span class="sp"></span><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-m="save">Save task</button>';
  var armed=false;
  openModal({title:ex?ex.ref+'  ·  Edit task':'New task',body:body,foot:foot,
    mount:function(){
      $('#task-form').addEventListener('submit',function(e){e.preventDefault();save()});
      $('#task-form').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'&&e.target.type!=='color'){e.preventDefault();save()}});
      // The "project color" default follows the project chosen in the form.

/* ---------- stages dialog ---------- */
function openStages(){
  var draft=state.stages.map(function(s){return Object.assign({},s)}),confirm=-1,removed=[];
  // Removed stages send their tasks to a stage the user picked; follow the chain if that one goes too.
  function dest(id){for(var n=0;n<50;n++){var r=removed.find(function(x){return x.id===id});if(!r)return id;id=r.to}return id}
  function count(id){return state.tasks.filter(function(t){return dest(stageKey(t))===id}).length}
  function nameOf(id){var s=draft.find(function(x){return x.id===id});return s?s.name:'the first stage'}
  function rows(){
    return draft.map(function(s,i){
      var n=count(s.id),del;
      if(confirm===i){
        var others=draft.filter(function(x,j){return j!==i});
        del='<span class="delq">'+(n?'Move its '+n+' task'+(n===1?'':'s')+' to':'Remove this empty stage?')+'</span>'
          +(n?'<select class="s-dest" aria-label="Move tasks to">'+others.map(function(x){return '<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>'}).join('')+'</select>':'')
          +'<button class="btn danger armed" type="button" data-m="del-ok" data-i="'+i+'">Remove stage</button><button class="btn ghost" type="button" data-m="del-cancel">Keep</button>';
      }else del='<button class="btn danger" type="button" data-m="del" data-i="'+i+'"'+(draft.length<2?' disabled':'')+'>Remove</button>';
      return '<div class="srow" data-i="'+i+'"><input type="text" class="s-name" maxlength="40" value="'+esc(s.name)+'" aria-label="Stage name">'
        +'<label>WIP limit<input type="number" class="s-wip wipin" min="0" max="999" placeholder="none" value="'+(s.wip||'')+'"></label>'
        +'<label><input type="checkbox" class="s-done"'+(s.done?' checked':'')+'> Counts as done</label>'
        +'<button class="icon-btn" type="button" data-m="left" data-i="'+i+'" aria-label="Move left"'+(i===0?' disabled':'')+'>&larr;</button>'
        +'<button class="icon-btn" type="button" data-m="right" data-i="'+i+'" aria-label="Move right"'+(i===draft.length-1?' disabled':'')+'>&rarr;</button>'
        +del+'</div>';
    }).join('')
    +(removed.length?'<p class="hint rm-note">'+removed.map(function(r){return 'Removing <strong>'+esc(r.name)+'</strong>: its tasks go to '+esc(nameOf(dest(r.to)))+'.'}).join('<br>')+'</p>':'');
  }
  function sync(){$$('#stage-rows .srow').forEach(function(r){var i=+r.dataset.i;draft[i].name=$('.s-name',r).value;var w=parseInt($('.s-wip',r).value,10);draft[i].wip=w>0?Math.min(999,w):null;draft[i].done=$('.s-done',r).checked})}
  function paint(){$('#stage-rows').innerHTML=rows()}
  openModal({title:'Workflow stages',wide:true,
    body:'<p class="hint">Stages are the vertical columns. A WIP limit warns you when too many tasks sit in one stage. Tasks in a stage marked as done are treated as finished.</p><div id="stage-rows">'+rows()+'</div><p class="form-err" id="s-err" role="alert" hidden></p>',
    foot:'<button class="btn" type="button" data-m="add">Add stage</button><span class="sp"></span><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-m="apply">Apply</button>',
    noFocus:true,
    action:function(name,btn){
      sync();var i=+btn.dataset.i;
      if(name==='add'){draft.push({id:uid('st_'),name:'New stage',wip:null,done:false});confirm=-1;paint();return}
      if(name==='left'||name==='right'){var j=name==='left'?i-1:i+1;var x=draft[i];draft[i]=draft[j];draft[j]=x;confirm=-1;paint();return}
      if(name==='del'){confirm=i;paint();return}
      if(name==='del-cancel'){confirm=-1;paint();return}
      if(name==='del-ok'){
        var sel=$('.srow[data-i="'+i+'"] .s-dest'),to=sel?sel.value:(draft[i===0?1:0]||{}).id;
        removed.push({id:draft[i].id,name:draft[i].name,to:to});draft.splice(i,1);confirm=-1;paint();return;
      }

      }
    }});

        // Deleting a project keeps its tasks (moved to No project) unless the user chose to delete them too.
        state.tasks=state.tasks.filter(function(t){var r=removed[t.projectId];return !(r&&r.mode==='all')});
        state.tasks.forEach(function(t){if(removed[t.projectId])t.projectId=''});
        state.projects=draft;commit();closeModal();
        var gone=Object.keys(removed).length;
        if(gone)offerUndo(gone===1?'Project deleted':gone+' projects deleted',snap);
      }
    }});
}

/* ---------- backup dialog ---------- */
function backupJson(){return JSON.stringify(state,null,2)}
function csvText(){
  var cols=['ref','title','project','stage','priority','assignee','start','due','blocked','created','completed','color','notes'];
  // Cells starting with = + - @ tab or CR run as formulas in Excel and Sheets; a leading ' keeps them as text.
  var q=function(v){v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=state.tasks.slice().sort(byOrder).map(function(t){var p=projectOf(projKey(t)),s=stageOf(stageKey(t));
    return [t.ref,t.title,p?p.name:'',s.name,t.priority,t.assignee,t.start,t.due,t.blocked?'yes':'no',t.createdAt,t.doneAt,cardColor(t),t.desc].map(q).join(',')});
  return '﻿'+cols.join(',')+'\r\n'+rows.join('\r\n')+'\r\n';
}
async function saveFile(name,data){
  var dl=null;try{dl=await window.claude.use('downloads')}catch(e){dl=null}
  if(!dl)return 'unavailable';
  try{await dl.save({filename:name,data:data});return 'ok'}catch(e){return (e&&e.code)||'unavailable'}
}
function openBackup(){
  var pending=null,last=state.meta.lastBackupAt;
  var body='<div class="sec"><h3>Download a backup</h3><p class="hint">The backup is one JSON file with every project, stage, task and deadline. Download one before big changes and keep a copy outside this board.'
    +(last?' Last backup: '+esc(new Date(last).toLocaleString())+'.':' No backup has been downloaded yet.')+'</p>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" data-m="dl-json">Download backup (.json)</button><button class="btn" type="button" data-m="dl-csv">Export tasks (.csv)</button><button class="btn" type="button" data-m="copy">Copy backup JSON</button></div>'
    +'<p class="msg" id="b-msg" role="status" hidden></p>'
    +'<details style="margin-top:10px" id="b-det"><summary class="hint" style="cursor:pointer">Show backup text</summary><textarea class="json" id="b-text" rows="6" readonly></textarea></details></div>'
    +'<div class="sec edit-only"><h3>Restore from a backup</h3><p class="hint">Restoring replaces everything on the board with the contents of the file. You can undo it for a few seconds afterwards.</p>'
    +'<input id="b-file" type="file" accept=".json,application/json"><p class="msg" id="r-msg" role="status" hidden></p>'
    +'<div style="margin-top:10px"><button class="btn danger" type="button" id="b-restore" data-m="restore" disabled>Replace board with this backup</button></div></div>';
  openModal({title:'Backup and restore',wide:true,noFocus:true,body:body,foot:'<span class="sp"></span><button class="btn" type="button" data-close>Done</button>',
    mount:function(){
      $('#b-text').value=backupJson();
      $('#b-file').addEventListener('change',function(ev){
        var f=ev.target.files&&ev.target.files[0],m=$('#r-msg'),b=$('#b-restore');pending=null;b.disabled=true;
        if(!f){m.hidden=true;return}
        var rd=new FileReader();
        rd.onload=function(){
          try{var s=normalize(JSON.parse(String(rd.result)));pending=s;b.disabled=false;
            m.className='msg ok';m.textContent=f.name+': '+s.projects.length+' projects, '+s.stages.length+' stages, '+s.tasks.length+' tasks.';}
          catch(e){m.className='msg err';m.textContent=(e&&e.message)||'That file could not be read as a backup.'}
          m.hidden=false;
        };
        rd.onerror=function(){m.className='msg err';m.textContent='The file could not be read.';m.hidden=false};
        rd.readAsText(f);
      });
    },
    action:async function(name,btn){
      var msg=$('#b-msg');
      function say(t,c){msg.className='msg '+(c||'');msg.textContent=t;msg.hidden=false}
      if(name==='dl-json'){
        var r=await saveFile('lab-board-backup-'+isoLocal(new Date())+'.json',backupJson());
        if(r==='ok'){state.meta.lastBackupAt=new Date().toISOString();commit();say('Backup saved.','ok')}
        else if(r==='declined')say('Download cancelled.');
        else{$('#b-det').open=true;say('Downloads are not available in this view. Use Copy backup JSON, or copy the text below into a file.','err')}
      }else if(name==='dl-csv'){
        var r2=await saveFile('lab-board-tasks-'+isoLocal(new Date())+'.csv',csvText());
        if(r2==='ok')say('CSV saved.','ok');else if(r2==='declined')say('Download cancelled.');else say('Downloads are not available in this view.','err');
      }else if(name==='copy'){
        try{await navigator.clipboard.writeText(backupJson());state.meta.lastBackupAt=new Date().toISOString();commit();say('Backup copied to the clipboard.','ok')}
        catch(e){var ta=$('#b-text');$('#b-det').open=true;ta.focus();ta.select();say('Copy was blocked. The text is selected below, press Ctrl+C or Cmd+C.','err')}
      }else if(name==='restore'&&pending){
        var snap=JSON.stringify(state);
        state=pending;state.meta.sample=!!state.meta.sample;commit();closeModal();offerUndo('Backup restored',snap);
      }
    }});
}

/* ---------- event wiring ---------- */
var suppressClickAt=0;
document.addEventListener('click',function(e){
  var close=e.target.closest('[data-close]');if(close&&!$('#overlay').hidden){closeModal();return}
  var m=e.target.closest('[data-m]');if(m&&cur&&cur.action){cur.action(m.dataset.m,m,e);return}
  if(e.target===$('#overlay')){if(downOnOverlay)requestClose();return}
  if(e.target.closest('#toast'))return;
  var a=e.target.closest('[data-act]');
  if(a){
    var k=a.dataset.act;
    if(k==='toggle-lane'){ui.collapsed[a.dataset.key]=!ui.collapsed[a.dataset.key];savePrefs();render();return}
    if(k==='more'){ui.expanded[a.dataset.key]=true;render();return}
    if(k==='less'){delete ui.expanded[a.dataset.key];render();return}
    if(k==='add'){var preset={stageId:a.dataset.stage};var g=ui.groupBy,l=a.dataset.lane;if(g==='priority')preset.priority=l;else if(g==='project')preset.projectId=l;else if(g==='assignee')preset.assignee=l;openTask(null,preset);return}
    if(k==='new'){openTask(null);return}
    if(k==='load-sample'){state=normalize(buildSample());commit();return}
    if(k==='clear-sample'){
      var snap=JSON.stringify(state);
      // Edited example tasks lose their sample flag on save, so only untouched examples go.
      // An example project that now holds the user's own tasks is kept.
      state.tasks=state.tasks.filter(function(t){return !t.sample});
      var used={};state.tasks.forEach(function(t){used[t.projectId]=1});
      state.projects=state.projects.filter(function(p){return !p.sample||used[p.id]});
      state.projects.forEach(function(p){delete p.sample});
      var kept=state.tasks.length;
      state.meta.sample=false;if(!kept)state.meta.nextNum=1;commit();
      offerUndo(kept?'Example data removed. '+kept+' task'+(kept===1?'':'s')+' you added or edited were kept.':'Example data removed',snap);return;
    }
  }
  // A touch drag ends with a synthetic click on the card; it must not open the dialog.
  if(Date.now()-suppressClickAt<600&&e.target.closest('.card'))return;
  var ed=e.target.closest('[data-edit]');if(ed){openTask(ed.dataset.edit);return}
  var c=e.target.closest('.card');if(c){openTask(c.dataset.id)}
});
$('#toast').addEventListener('click',function(e){
  if(!e.target.closest('[data-toast-act]')||!toastAct)return;
  var a=toastAct;toastAct=null;clearTimeout(toastT);$('#toast').hidden=true;a.fn();
});
// Color pickers: the native picker reports while dragging, the hex field applies once it holds a valid code.
document.addEventListener('input',function(e){
  var el=e.target;if(!cur||!cur.action||!el.classList)return;
  if(el.classList.contains('cp-in')){cur.action('pick',{dataset:{ctx:el.dataset.ctx,c:el.value.toLowerCase()}});return}
  if(el.classList.contains('cp-hex')){
    var c=parseHex(el.value);el.setAttribute('aria-invalid',String(!c&&!!el.value.trim()));
    if(c)cur.action('pick',{dataset:{ctx:el.dataset.ctx,c:c}});
  }
});
// A text selection that starts in a field and ends on the backdrop must not close the dialog.
var downOnOverlay=false;
document.addEventListener('mousedown',function(e){downOnOverlay=e.target===$('#overlay')});
document.addEventListener('keydown',function(e){
  var open=!$('#overlay').hidden;
  if(e.key==='Escape'&&touch&&touch.lifted){endTouch(false);return}
  if(e.key==='Escape'&&open){requestClose();return}
  if(e.key==='Tab'&&open){
    var f=$$('#modal button:not([disabled]),#modal input:not([disabled]),#modal select:not([disabled]),#modal textarea:not([disabled]),#modal summary').filter(function(x){return x.offsetParent!==null});
    if(!f.length)return;
    var first=f[0],last=f[f.length-1],a=document.activeElement;
    if(!$('#modal').contains(a)||(e.shiftKey&&a===first)||(!e.shiftKey&&a===last)){e.preventDefault();(e.shiftKey?last:first).focus()}
    return;
  }
  if(open)return;
  var c=e.target.classList&&e.target.classList.contains('card')?e.target:null;
  if(c&&e.key==='Enter'){openTask(c.dataset.id);return}
  // Keyboard alternative to drag and drop: Alt+Left/Right moves a card to the previous or next stage.
  if(c&&e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&!readOnly){
    var t=state.tasks.find(function(x){return x.id===c.dataset.id}),i=state.stages.findIndex(function(s){return s.id===stageKey(t)}),j=i+(e.key==='ArrowLeft'?-1:1);
    if(j<0||j>=state.stages.length)return;
    e.preventDefault();applyMove(t.id,state.stages[j].id,laneKey(t),null);
    var moved=$('.card[data-id="'+cssEsc(t.id)+'"]');if(moved)moved.focus();
    toast('Moved to '+state.stages[j].name);
  }
});
$('#btn-new').addEventListener('click',function(){openTask(null)});
$('#btn-projects').addEventListener('click',openProjects);
$('#btn-stages').addEventListener('click',openStages);
$('#btn-backup').addEventListener('click',openBackup);
$$('.tabs button').forEach(function(b){b.addEventListener('click',function(){ui.view=b.dataset.view;savePrefs();render()})});
$('#grp').addEventListener('change',function(e){ui.groupBy=e.target.value;savePrefs();render()});
$('#flt-project').addEventListener('change',function(e){ui.f.project=e.target.value;render()});
$('#flt-assignee').addEventListener('change',function(e){ui.f.assignee=e.target.value;render()});
// Debounced on large boards: a keystroke rebuilds every cell that the filter changes.
var qTimer=null;
$('#flt-q').addEventListener('input',function(e){clearTimeout(qTimer);qTimer=setTimeout(function(){ui.f.q=e.target.value.trim();render()},state&&state.tasks.length>500?200:0)});
$('#flt-overdue').addEventListener('click',function(){ui.f.overdue=!ui.f.overdue;render()});
$('#flt-clear').addEventListener('click',function(){ui.f={project:'',assignee:'',q:'',overdue:false};$('#flt-q').value='';render()});

var view=$('#view');
view.addEventListener('dragstart',function(e){
  var c=e.target.closest&&e.target.closest('.card');
  // Touch is handled by the long-press code below; some mobile browsers also start a native drag.
  if(!c||readOnly||touch){e.preventDefault();return}
  dragId=c.dataset.id;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}
  setTimeout(function(){c.classList.add('dragging')},0);
});
view.addEventListener('dragover',function(e){
  if(!dragId)return;var cell=e.target.closest('.cell');if(!cell)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';overCell(cell,e.clientY);
});
view.addEventListener('dragleave',function(e){
  var cell=e.target.closest&&e.target.closest('.cell');
  if(cell&&!cell.contains(e.relatedTarget)){cell.classList.remove('over');if(dropLine&&dropLine.parentNode===cell)cell.removeChild(dropLine)}
});
view.addEventListener('drop',function(e){
  if(!dragId)return;var cell=e.target.closest('.cell');if(!cell)return;
  e.preventDefault();var id=dragId;dragId=null;dropOn(cell,e.clientY,id);
});
view.addEventListener('dragend',function(){dragId=null;clearDrop();$$('.card.dragging').forEach(function(c){c.classList.remove('dragging')});});

/* touch drag: press and hold a card for about a third of a second, then drag it.
   A quick swipe still scrolls the board; a tap still opens the card. */
var touch=null,LIFT_MS=350;
view.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'||readOnly||!e.isPrimary)return;
  var c=e.target.closest('.card');if(!c||ui.view!=='board')return;
  touch={id:c.dataset.id,card:c,pid:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,lifted:false};
  touch.timer=setTimeout(liftTouch,LIFT_MS);
});
function liftTouch(){
  if(!touch)return;
  var c=touch.card,r=c.getBoundingClientRect(),g=c.cloneNode(true);
  g.classList.add('drag-ghost');g.removeAttribute('tabindex');g.style.width=r.width+'px';
  touch.dx=touch.x0-r.left;touch.dy=touch.y0-r.top;touch.ghost=g;touch.lifted=true;
  document.body.appendChild(g);placeGhost();
  dragId=touch.id;c.classList.add('dragging');document.body.classList.add('touch-dragging');
  try{if(navigator.vibrate)navigator.vibrate(12)}catch(x){}
  touch.scroll=setInterval(autoScroll,30);
}
function placeGhost(){if(touch&&touch.ghost)touch.ghost.style.transform='translate('+(touch.x-touch.dx)+'px,'+(touch.y-touch.dy)+'px) rotate(2deg)'}
function cellAt(x,y){var el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('#view .cell'):null}
// Near an edge, scroll the board sideways or the page up and down so far cells can be reached.
function autoScroll(){
  if(!touch||!touch.lifted)return;
  var w=$('.board-wrap'),edge=48,v=0,h=0;
  if(w){var r=w.getBoundingClientRect();if(touch.x<r.left+edge)h=-14;else if(touch.x>r.right-edge)h=14;if(h)w.scrollLeft+=h}
  if(touch.y<edge)v=-14;else if(touch.y>window.innerHeight-edge)v=14;
  if(v)window.scrollBy(0,v);
  if(h||v){var cell=cellAt(touch.x,touch.y);if(cell)overCell(cell,touch.y)}
}
window.addEventListener('pointermove',function(e){
  if(!touch||e.pointerId!==touch.pid)return;
  touch.x=e.clientX;touch.y=e.clientY;
  if(!touch.lifted){if(Math.abs(e.clientX-touch.x0)+Math.abs(e.clientY-touch.y0)>10){clearTimeout(touch.timer);touch=null}return}
  placeGhost();
  var cell=cellAt(e.clientX,e.clientY);if(cell)overCell(cell,e.clientY);else clearDrop();
},{passive:true});
// Once a card is lifted the finger drags the card, not the page.
document.addEventListener('touchmove',function(e){if(touch&&touch.lifted&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){if(touch&&e.target.closest&&e.target.closest('.card'))e.preventDefault()});
function endTouch(drop){
  if(!touch)return;
  var t=touch;touch=null;clearTimeout(t.timer);clearInterval(t.scroll);
  if(!t.lifted)return;
  suppressClickAt=Date.now();
  if(t.ghost&&t.ghost.parentNode)t.ghost.parentNode.removeChild(t.ghost);
  document.body.classList.remove('touch-dragging');t.card.classList.remove('dragging');dragId=null;
  var cell=drop?cellAt(t.x,t.y):null;
  if(cell)dropOn(cell,t.y,t.id);else clearDrop();
}
window.addEventListener('pointerup',function(e){if(touch&&e.pointerId===touch.pid)endTouch(true)});
window.addEventListener('pointercancel',function(e){if(touch&&e.pointerId===touch.pid)endTouch(false)});

// TODAY drives overdue badges and stats; keep it current when the tab stays open past midnight.
function refreshToday(){var t=toDay(isoLocal(new Date()));if(t!==TODAY){TODAY=t;if($('#overlay').hidden)render()}}
setInterval(refreshToday,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshToday()});

boot();
})();
</script>
